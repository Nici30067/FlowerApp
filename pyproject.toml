[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "osm-travel-companion"
version = "0.2.0"
description = "Collaborative travel planning with specialist agents, OpenStreetMap, and validated itinerary revisions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "flwr>=1.37.0,<1.38.0",
  "openai>=2.16.0,<3.0.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[project.scripts]
travel-demo = "travel_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["travel_agent"]

[tool.flwr.app]
publisher = "tauska67"
display-name = "OSM Travel Companion"
fab-format-version = 1
flwr-version-target = "1.37.0"
fab-include = ["travel_agent/**/*.py", "travel_agent/fixtures/*.json", "LICENSE", "README.md"]

[tool.flwr.app.components]
agentapp = "travel_agent.agent_app:app"

[tool.flwr.app.config.agent]
input = "Plan the Berlin demonstration itinerary."
# Flower Endeavor 1.0 on SuperGrid. Fallback: "openai/gpt-5.6-sol" (any Responses-capable runtime model).
model = "flower-endeavor-v1.0"
model-candidates = ""
model-timeout-s = 120
wall-time-s = 900
# Hard cap on model calls per planning step (SuperGrid credits are charged per call and token).
max-model-calls = 12
# 0 = one bounded model call per specialist (fastest). Up to 10 evidence tool rounds are allowed.
max-tool-turns = 0
# Responses API reasoning effort: minimal, low, medium, high, xhigh, or "" to omit the field.
reasoning-effort = "low"
public-web = false

[tool.flwr.app.config.travel]
data-mode = "fixture"
api-url = ""
job-id = ""
job-token = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E731", "E501", "E701", "E702", "E741", "B008", "SIM102", "SIM105", "C401", "UP017"]
