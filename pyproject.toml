[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "osm-travel-companion"
version = "0.3.2"
description = "Collaborative travel planning with specialist agents, OpenStreetMap, and validated itinerary revisions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "flwr>=1.37.0,<1.38.0",
  "openai>=2.16.0,<3.0.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[project.scripts]
travel-demo = "travel_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["travel_agent"]

[tool.flwr.app]
publisher = "tauska67"
display-name = "OSM Travel Companion"
fab-format-version = 1
flwr-version-target = "1.37.0"
fab-include = ["travel_agent/**/*.py", "travel_agent/fixtures/*.json", "LICENSE", "README.md"]

[tool.flwr.app.components]
agentapp = "travel_agent.agent_app:app"

[tool.flwr.app.config.agent]
input = "Plan the Berlin demonstration itinerary."
# Flower Endeavor 1.0 on SuperGrid. Fallback: "openai/gpt-5.6-sol" (any Responses-capable runtime model).
model = "flower-endeavor-v1.0"
model-candidates = ""
model-timeout-s = 120
wall-time-s = 900
# Hard cap on model calls per planning step (SuperGrid credits are charged per call and token).
# 0 = auto: 5 * (max-tool-turns + 2). Set a positive number to override the automatic cap.
max-model-calls = 0
# Upper bound on output tokens per model call (Responses API max_output_tokens).
max-output-tokens = 2000
# 0 = one bounded model call per specialist (fastest). Up to 10 evidence tool rounds are allowed.
max-tool-turns = 0
# Responses API reasoning effort: minimal, low, medium, high, xhigh, or "" to omit the field.
reasoning-effort = "low"
public-web = false

[tool.flwr.app.config.travel]
# Data providers of a Flower run come from these keys only (no environment variables inside a run).
# "live" plans any geocoded city from the zero-key OpenStreetMap stack: Open-Meteo geocoding, Overpass,
# OSRM (public FOSSGIS instance) and Open-Meteo weather. "fixture" plans the bundled, labeled central-Berlin day:
#   flwr run . supergrid --run-config 'travel.data-mode="fixture"'
data-mode = "live"
# Sent in the User-Agent of every live request; the operators of the public instances ask for a reachable contact.
contact = "osm-travel-companion Flower Hub AgentApp"
# The public Overpass instance is only used with this explicit consent; set overpass-url to use your own.
allow-public-overpass = true
# osrm (public FOSSGIS instance, no key) or ors (OpenRouteService, requires ors-api-key).
router = "osrm"
# Empty strings select the built-in default endpoint of each service.
osrm-url-template = ""
overpass-url = ""
ors-url = ""
ors-api-key = ""
weather-url = ""
geocoder-url = ""
# Legacy HTTPS bridge mode only.
api-url = ""
job-id = ""
job-token = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E731", "E501", "E701", "E702", "E741", "B008", "SIM102", "SIM105", "C401", "UP017"]
